name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/protect-main-ci]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check server and web types
        run: npm run check
      - name: Run existing test suite
        run: npm test
      - name: Validate Cloudflare deployment configuration
        run: npm run cloudflare:check
